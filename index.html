<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HKDSE Math - Rounding Challenge</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-dark: #7c3aed;
      --secondary: #f43f5e;
      --secondary-dark: #e11d48;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #1e293b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Segoe UI', system-ui, sans-serif; }
    
    body { 
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text); 
      padding: 2rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container { width: 100%; max-width: 700px; z-index: 10; position: relative; }
    
    .card { 
      background: var(--card-bg); 
      border-radius: 24px; 
      padding: 2.5rem; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15); 
      margin-bottom: 2rem; 
      border: 6px solid #ffffff;
      position: relative;
    }

    .mascot {
      font-size: 4rem;
      text-align: center;
      margin-top: -60px;
      margin-bottom: 10px;
      text-shadow: 0 10px 20px rgba(0,0,0,0.1);
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    h1 { color: var(--primary-dark); font-size: 2.2rem; margin-bottom: 0.5rem; text-align: center; text-transform: uppercase; letter-spacing: 2px;}
    .subtitle { text-align: center; color: #475569; font-size: 1.1rem; margin-bottom: 2rem; font-weight: 600; }
    
    .form-group { margin-bottom: 1.5rem; }
    .form-row { display: flex; gap: 1rem; }
    .form-row .form-group { flex: 1; }

    label { display: block; margin-bottom: 0.5rem; font-weight: 700; color: #334155; }
    
    input[type="text"], input[type="number"] { 
      width: 100%; 
      padding: 1rem 1.2rem; 
      border: 3px solid var(--border); 
      border-radius: 12px; 
      font-size: 1.3rem; 
      outline: none;
      background: #f8fafc;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    input:focus { border-color: var(--primary); background: #ffffff; transform: scale(1.02); box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }
    
    button.btn-submit { 
      background: var(--primary); 
      color: white; 
      border: none; 
      padding: 1rem 2rem; 
      border-radius: 16px; 
      font-size: 1.4rem; 
      cursor: pointer; 
      font-weight: 700; 
      width: 100%;
      margin-top: 1rem;
      transition: all 0.1s;
      box-shadow: 0 8px 0 var(--primary-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button.btn-submit:active { transform: translateY(8px); box-shadow: 0 0px 0 var(--primary-dark); }
    button.btn-submit:hover { filter: brightness(1.1); }
    
    .stats-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: #f1f5f9; 
      padding: 1rem 1.5rem; 
      border-radius: 16px; 
      margin-bottom: 1.5rem; 
      font-weight: 700; 
      border: 3px solid #e2e8f0;
    }

    .badge-score { background: #fef08a; color: #854d0e; padding: 0.5rem 1.2rem; border-radius: 20px; font-size: 1.1rem; box-shadow: 0 4px 0 #eab308; }
    .timer { font-size: 1.3rem; color: #fff; background: var(--success); padding: 0.5rem 1.2rem; border-radius: 20px; box-shadow: 0 4px 0 #059669; transition: background 0.3s; }
    .timer.warning { background: var(--danger); box-shadow: 0 4px 0 #b91c1c; animation: pulse-red 0.5s infinite alternate; }
    @keyframes pulse-red { from { transform: scale(1); } to { transform: scale(1.1); } }

    .question-box { 
      background: #ffffff; 
      color: #0f172a;
      padding: 2.5rem 1.5rem; 
      border-radius: 20px; 
      font-size: 1.8rem; 
      font-weight: 700;
      text-align: center; 
      margin-bottom: 1.5rem; 
      border: 4px dashed var(--primary);
      box-shadow: inset 0 0 20px rgba(139, 92, 246, 0.1);
    }

    .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }

    .feedback { 
      font-weight: 800; 
      text-align: center; 
      margin-top: 1.5rem; 
      min-height: 60px; 
      font-size: 1.4rem;
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: popIn 0.3s ease-out;
    }
    .feedback.correct { color: #064e3b; background: #d1fae5; border: 3px solid #34d399; }
    .feedback.incorrect { color: #7f1d1d; background: #fee2e2; border: 3px solid #f87171; }
    .hidden { display: none !important; }

    .confetti { position: fixed; top: -10px; width: 12px; height: 12px; z-index: 9999; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
  </style>
</head>
<body>

  <div class="container">
    <div id="start-screen" class="card">
      <div class="mascot">🦉</div>
      <h1>Rounding Challenge</h1>
      <p class="subtitle">Time Limit: <strong>20s per question</strong> | Target: <strong>15 Marks</strong></p>
      <form id="start-form">
        <div class="form-row">
          <div class="form-group">
            <label for="student-class">Class:</label>
            <input type="text" id="student-class" required placeholder="e.g. 3A">
          </div>
          <div class="form-group">
            <label for="class-number">Class No.:</label>
            <input type="number" id="class-number" required min="1" max="50" placeholder="e.g. 15">
          </div>
        </div>
        <div class="form-group">
          <label for="student-name">Full Name:</label>
          <input type="text" id="student-name" required placeholder="e.g. Alex Wong">
        </div>
        <button type="submit" class="btn-submit" style="background: var(--secondary); box-shadow: 0 8px 0 var(--secondary-dark);">Play Now 🚀</button>
      </form>
    </div>

    <div id="practice-screen" class="card hidden">
      <div class="mascot">🤖</div>
      <div class="stats-bar">
        <div style="font-size: 1.2rem;">👤 <span id="display-info" style="color: var(--primary-dark);"></span></div>
        <div class="badge-score">⭐ <span id="current-score">0</span> / 15</div>
        <div id="timer-box" class="timer">⏱️ <span id="timer-count">20</span>s</div>
      </div>

      <div class="question-box" id="question-display">Loading question...</div>

      <form id="answer-form">
        <div class="form-group">
          <!-- Changed to type="text" to prevent browsers from deleting trailing zeros like .10 -->
          <input type="text" inputmode="decimal" pattern="[0-9.-]*" id="math-input" placeholder="Enter exact answer..." required autocomplete="off">
        </div>
        <button type="submit" class="btn-submit">Submit ✅</button>
      </form>
      <div id="feedback-message" class="feedback hidden"></div>
    </div>

    <div id="end-screen" class="card hidden" style="text-align: center;">
      <div class="mascot" style="animation: bounce 1s infinite;">🏆</div>
      <h1 style="color: #ea580c; font-size: 2.8rem;">You Did It!</h1>
      <p class="subtitle" style="font-size: 1.3rem;">You collected <strong>15 stars</strong> in <strong id="total-time-used" style="color: var(--primary);">0</strong>!</p>
      
      <div id="sync-status" style="margin-top: 1.5rem; font-size: 1.2rem; font-weight: 700; padding: 1.2rem; border-radius: 12px; background: #f8fafc; border: 3px dashed #cbd5e1;">
        📤 Sending score to teacher...
      </div>
      
      <button onclick="location.reload()" class="btn-submit" style="margin-top: 2rem; max-width: 300px; background: var(--secondary); box-shadow: 0 8px 0 var(--secondary-dark);">Play Again 🔄</button>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoMGuLMQByS3tbMdXcOAnMu9RihNom8FuJWBISd3EgOH2fHqfitmL6eF6C5hEshyGC/exec";

    const TARGET_SCORE = 15;
    const QUESTION_TIME_LIMIT = 20;
    
    let studentClass = "", classNumber = "", studentName = "";
    let score = 0, totalAttempts = 0;
    let timerInterval = null, totalTimerInterval = null;
    let timeLeft = QUESTION_TIME_LIMIT, totalSecondsUsed = 0;
    let currentExpectedAnswer = ""; // Changed to string to enforce trailing zeros

    const startScreen = document.getElementById('start-screen');
    const practiceScreen = document.getElementById('practice-screen');
    const endScreen = document.getElementById('end-screen');
    const questionDisplay = document.getElementById('question-display');
    const feedbackEl = document.getElementById('feedback-message');
    const mathInput = document.getElementById('math-input');
    const timerBox = document.getElementById('timer-box');

    function throwConfetti() {
      const colors = ['#8b5cf6', '#f43f5e', '#10b981', '#f59e0b', '#3b82f6'];
      for (let i = 0; i < 100; i++) {
        let confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
        document.body.appendChild(confetti);
      }
    }

    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    
    function exactRound(num, mode, exp) {
      let val = num;
      if (mode === 'off') {
        return Number(Math.round(Number(val + 'e' + exp)) + 'e' + -exp);
      } else if (mode === 'up') {
        return Number(Math.ceil(Number(val + 'e' + exp)) + 'e' + -exp);
      } else if (mode === 'down') {
        return Number(Math.floor(Number(val + 'e' + exp)) + 'e' + -exp);
      }
    }

    function getNextDigit(numStr, targetType, param) {
      const parts = numStr.split('.');
      const intPart = parts[0];
      const decPart = parts[1];
      const combined = intPart + decPart;

      if (targetType === 'hundred') {
        return intPart.length >= 2 ? parseInt(intPart[intPart.length - 2]) : 0;
      } else if (targetType === 'ten') {
        return parseInt(intPart[intPart.length - 1]);
      } else if (targetType === 'integer') {
        return parseInt(decPart[0]);
      } else if (targetType === 'dp') {
        return parseInt(decPart[param]); 
      } else if (targetType === 'sf') {
        return parseInt(combined[param]); 
      }
      return 0;
    }

    function generateQuestion() {
      questionDisplay.classList.remove('pop-in');
      void questionDisplay.offsetWidth;
      questionDisplay.classList.add('pop-in');
      
      const actions = ['up', 'down', 'off'];
      const action = actions[getRandomInt(0, 2)];
      
      const categories = ['placeValue', 'dp', 'sf'];
      const selectedCategory = categories[getRandomInt(0, 2)];
      
      let targetType;
      let dpCount = 0, sfCount = 0, param = 0;

      if (selectedCategory === 'placeValue') {
        const placeValues = ['integer', 'ten', 'hundred'];
        targetType = placeValues[getRandomInt(0, 2)];
      } else if (selectedCategory === 'dp') {
        targetType = 'dp';
        dpCount = getRandomInt(1, 3);
        param = dpCount;
      } else {
        targetType = 'sf';
        sfCount = getRandomInt(1, 4);
        param = sfCount;
      }

      let num = 0;
      let numStr = "";
      let valid = false;

      while (!valid) {
        let requiredDP = 1;
        if (targetType === 'dp') requiredDP = param + 1;
        else if (targetType === 'sf') requiredDP = param + 1;
        else if (targetType === 'integer') requiredDP = 2;
        
        let intPart = Math.floor(Math.random() * 900 + 10).toString();
        let decPart = "";
        
        for (let i = 0; i < requiredDP - 1; i++) {
          decPart += Math.floor(Math.random() * 10).toString();
        }
        decPart += Math.floor(Math.random() * 9 + 1).toString();
        
        numStr = intPart + "." + decPart;
        num = parseFloat(numStr);
        
        let nextDigit = getNextDigit(numStr, targetType, param);

        if (action === 'up') {
          if (nextDigit >= 0 && nextDigit <= 4) valid = true;
        } else if (action === 'down') {
          if (nextDigit >= 5 && nextDigit <= 9) valid = true;
        } else {
          valid = true;
        }
      }

      let questionText = "";
      let answerMath = 0;
      let answerFormatted = ""; // Used for strict string comparison

      if (targetType === 'integer') {
        questionText = `Round ${action} ${numStr} to the nearest integer.`;
        answerMath = exactRound(num, action, 0);
        answerFormatted = answerMath.toFixed(0);
      } 
      else if (targetType === 'ten') {
        questionText = `Round ${action} ${numStr} to the nearest ten.`;
        answerMath = exactRound(num, action, -1);
        answerFormatted = answerMath.toString();
      }
      else if (targetType === 'hundred') {
        questionText = `Round ${action} ${numStr} to the nearest hundred.`;
        answerMath = exactRound(num, action, -2);
        answerFormatted = answerMath.toString();
      }
      else if (targetType === 'dp') {
        const plural = dpCount > 1 ? 'places' : 'place';
        questionText = `Round ${action} ${numStr} to ${dpCount} decimal ${plural}.`;
        answerMath = exactRound(num, action, dpCount);
        // FORCE trailing zeros (e.g. 5.10 instead of 5.1)
        answerFormatted = answerMath.toFixed(dpCount);
      }
      else if (targetType === 'sf') {
        const plural = sfCount > 1 ? 'figures' : 'figure';
        questionText = `Round ${action} ${numStr} to ${sfCount} significant ${plural}.`;
        const magnitude = Math.floor(Math.log10(Math.abs(num)));
        const exponent = sfCount - 1 - magnitude;
        answerMath = exactRound(num, action, exponent);
        
        // FORCE trailing zeros for sig figs if needed
        if (exponent > 0) {
          answerFormatted = answerMath.toFixed(exponent);
        } else {
          answerFormatted = answerMath.toString();
        }
      }

      currentExpectedAnswer = answerFormatted;
      questionDisplay.textContent = questionText;
    }

    function startQuestionTimer() {
      clearInterval(timerInterval);
      timeLeft = QUESTION_TIME_LIMIT;
      timerBox.classList.remove('warning');
      document.getElementById('timer-count').textContent = timeLeft;

      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer-count').textContent = timeLeft;
        
        if(timeLeft <= 5 && timeLeft > 0) { timerBox.classList.add('warning'); }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerBox.classList.remove('warning');
          processAnswer(false, `⏰ Time's up! Answer: ${currentExpectedAnswer}`);
        }
      }, 1000);
    }

    function startTotalTimer() {
      totalSecondsUsed = 0;
      clearInterval(totalTimerInterval);
      totalTimerInterval = setInterval(() => { totalSecondsUsed++; }, 1000);
    }

    function processAnswer(isUserSubmit = true, timeoutMessage = "") {
      clearInterval(timerInterval);
      timerBox.classList.remove('warning');
      totalAttempts++;
      feedbackEl.classList.remove('hidden');
      practiceScreen.classList.remove('shake');
      mathInput.disabled = true;

      let isCorrect = false;

      if (!isUserSubmit) {
        practiceScreen.classList.add('shake');
        feedbackEl.className = "feedback incorrect";
        feedbackEl.textContent = timeoutMessage;
      } else {
        // Evaluate purely as a string to mandate trailing zeros
        const userVal = mathInput.value.trim();
        if (userVal === currentExpectedAnswer) {
          isCorrect = true;
          score++;
          document.getElementById('current-score').textContent = score;
          feedbackEl.className = "feedback correct";
          feedbackEl.innerHTML = "✨ Awesome! +1 Star ⭐";
        } else {
          practiceScreen.classList.add('shake');
          feedbackEl.className = "feedback incorrect";
          feedbackEl.textContent = `Oops! ❌ Exact format required: ${currentExpectedAnswer}`;
        }
      }

      if (score >= TARGET_SCORE) {
        clearInterval(totalTimerInterval);
        setTimeout(() => { showEndScreen(); saveRecord(); throwConfetti(); }, 1500);
      } else {
        const delay = isCorrect ? 1500 : 5000;
        setTimeout(nextQuestion, delay);
      }
    }

    function nextQuestion() {
      mathInput.value = "";
      mathInput.disabled = false;
      feedbackEl.classList.add('hidden');
      practiceScreen.classList.remove('shake');
      mathInput.focus();
      generateQuestion();
      startQuestionTimer();
    }

    function saveRecord() {
      const recordPayload = {
        className: studentClass,
        classNumber: classNumber,
        name: studentName,
        score: score,
        totalAttempts: totalAttempts,
        timeUsed: totalSecondsUsed
      };

      const syncStatusEl = document.getElementById('sync-status');
      
      if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(recordPayload)
        })
        .then(() => {
          syncStatusEl.innerHTML = "✅ High Score saved to the Teacher's Book!";
          syncStatusEl.style.color = "#047857";
          syncStatusEl.style.backgroundColor = "#d1fae5";
          syncStatusEl.style.borderColor = "#34d399";
        })
        .catch(err => {
          syncStatusEl.innerHTML = "⚠️ Network error saving score.";
          syncStatusEl.style.color = "#b91c1c";
          syncStatusEl.style.backgroundColor = "#fee2e2";
          syncStatusEl.style.borderColor = "#f87171";
        });
      } else {
        syncStatusEl.innerHTML = "ℹ️ Test mode: Saved locally only.";
      }
    }

    function showEndScreen() {
      practiceScreen.classList.add('hidden');
      endScreen.classList.remove('hidden');
      const mins = Math.floor(totalSecondsUsed / 60);
      const secs = totalSecondsUsed % 60;
      document.getElementById('total-time-used').textContent = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
    }

    document.getElementById('start-form').addEventListener('submit', (e) => {
      e.preventDefault();
      studentClass = document.getElementById('student-class').value.trim();
      classNumber = document.getElementById('class-number').value.trim();
      studentName = document.getElementById('student-name').value.trim();

      document.getElementById('display-info').textContent = `${studentClass} (${classNumber}) ${studentName}`;
      startScreen.classList.add('hidden');
      practiceScreen.classList.remove('hidden');
      
      score = 0;
      totalAttempts = 0;
      document.getElementById('current-score').textContent = score;
      startTotalTimer();
      nextQuestion();
    });

    document.getElementById('answer-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if(mathInput.value.trim() !== "") {
        processAnswer(true);
      }
    });
  </script>
</body>
</html>
